# 可選：用 PostgreSQL 取代預設的 SQLite。
#   docker compose up -d db
#   export DATABASE_URL=postgresql+psycopg://crudelab:crudelab@localhost:5432/crudelab
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crudelab
      POSTGRES_PASSWORD: crudelab
      POSTGRES_DB: crudelab
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
