# 可選：用 PostgreSQL 取代預設的 SQLite。
# 密碼不寫在這個文件裡。啟動前在終端裡設好（只在這個終端窗口有效）：
#   read -rs POSTGRES_PASSWORD && export POSTGRES_PASSWORD     # 輸入不回顯，也不進終端歷史
#   docker compose up -d db
# 然後把連接串存進密鑰文件（同樣不回顯）：
#   crudelab secret set DATABASE_URL
#   輸入：postgresql+psycopg://crudelab:你的密碼@localhost:5432/crudelab
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crudelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先設定環境變量 POSTGRES_PASSWORD}
      POSTGRES_DB: crudelab
    ports: ["127.0.0.1:5432:5432"]     # 只在本機開放，不對外
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
