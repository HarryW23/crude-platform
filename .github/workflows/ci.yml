name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_secrets.py
      - run: ruff check src tests scripts
      - run: crudelab check
      - run: pytest -q
  postgres:
    # 同一套測試在 PostgreSQL 上再跑一遍（#34）：每個測試從遷移好的模板庫複製一個新庫。
    # 服務器版本跟這台機器上 pg_dump / pg_restore 的大版本一致（客戶端比服務器新時，恢復會發出服務器不認識的設定）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 啟動和 pg_dump 同版本的 PostgreSQL
        run: |
          major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump 大版本：$major"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust "postgres:$major"
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q
        env:
          CRUDELAB_TEST_PG: postgresql+psycopg://postgres@localhost:5432
  e2e:
    # 瀏覽器巡檢：用演示數據啟動前台和後台，逐頁打開（淺色 / 深色），檢查腳本錯誤、錯誤提示、橫向滾動
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e
        env:
          CRUDELAB_E2E: "1"
