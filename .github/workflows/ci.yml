name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"     # 每周一跑一次：沒有提交的周也能發現依賴裡新公佈的漏洞
jobs:
  test:
    # 品質門檻：密鑰掃描、代碼風格、配置校驗、類型檢查（只減不增）、全部測試 + 覆蓋率下限
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: python scripts/check_secrets.py
      - run: ruff check src tests scripts
      - run: crudelab check
      - run: python scripts/check_types.py
      - run: python scripts/check_lock.py --offline
      # 多核並行跑，標了 serial 的（起真實服務進程、佔端口）之後單獨順序跑；兩次的覆蓋率合併後再看下限
      - run: coverage run -m pytest -q -n auto -m "not serial"
      - run: coverage run -m pytest -q -m serial
      - run: coverage combine
      - run: coverage report
  postgres:
    # 同一套測試在 PostgreSQL 上再跑一遍（#34）：每個測試從遷移好的模板庫複製一個新庫。
    # 服務器版本跟這台機器上 pg_dump / pg_restore 的大版本一致（客戶端比服務器新時，恢復會發出服務器不認識的設定）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 啟動和 pg_dump 同版本的 PostgreSQL
        run: |
          major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump 大版本：$major"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust "postgres:$major"
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - run: pip install -e ".[dev,postgres]" -c constraints.txt
      - run: pytest -q -n auto -m "not serial"
        env:
          CRUDELAB_TEST_PG: postgresql+psycopg://postgres@localhost:5432
      # 現有的 serial 測試（多進程）在 PostgreSQL 上整個跳過：一個都沒選到時 pytest 返回 5，這裡算正常；其他非 0 照樣失敗
      - run: pytest -q -m serial || [ $? -eq 5 ]
        env:
          CRUDELAB_TEST_PG: postgresql+psycopg://postgres@localhost:5432
  oldest-python:
    # 支持的最低版本 Python 3.11：鎖定的依賴在它上面能裝、全部測試能過。
    # 同時用非 UTC 的本機時區跑：依賴本機時區的寫法（例如不帶時區的 timestamp()）在這裡會暴露
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest -q -n auto -m "not serial" && pytest -q -m serial
  e2e:
    # 瀏覽器巡檢：用演示數據啟動前台和後台，逐頁打開（淺色 / 深色），檢查腳本錯誤、錯誤提示、橫向滾動
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,e2e]" -c constraints.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e
        env:
          CRUDELAB_E2E: "1"
  supply-chain:
    # 依賴：鎖定的版本在 macOS / Windows / Linux、Python 3.11–3.13 上都有現成安裝包；沒有已知漏洞
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packaging pip-audit
      - run: python scripts/check_lock.py
      - run: grep -v '^#' constraints.txt > /tmp/locked.txt && pip-audit -r /tmp/locked.txt --progress-spinner off
