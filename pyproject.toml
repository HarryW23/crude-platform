[project]
name = "crudelab"
version = "0.4.0"
description = "原油研究平台：數據 → 指標 → 模型 → 推演 → 報告"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "alembic>=1.13",
  "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
crudelab = "crudelab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crudelab = ["web/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/crudelab/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]   # FastAPI 的 Depends(...) 寫在參數預設值裡是慣用法
