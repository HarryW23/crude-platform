[project]
name = "crudelab"
version = "0.44.0"
description = "原油研究平台：數據 → 指標 → 模型 → 推演 → 報告"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "alembic>=1.13",
  "pydantic>=2.6",
  "opencc-python-reimplemented>=0.1.7",   # 繁→簡（金十用簡體），見 src/crudelab/zh.py
  "xlrd>=2.0.1",                          # 舊版 .xls（xlrd 2.x 只讀 .xls），見 connectors/excel.py
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "xlwt>=1.3.0", "httpx2>=2.16"]   # xlwt 在測試裡造 .xls；httpx2 給測試客戶端
e2e = ["playwright>=1.45"]           # 瀏覽器巡檢（tests/e2e），CI 單獨一步運行

[project.scripts]
crudelab = "crudelab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crudelab = ["web/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 我們自己的代碼（含測試）觸發的棄用警告直接算失敗；第三方庫的照常只警告（免得上游一升級 CI 就無故變紅）
filterwarnings = [
  "error::DeprecationWarning:crudelab.*",
  "error::DeprecationWarning:test_.*",
  "error::DeprecationWarning:conftest",
  "error::PendingDeprecationWarning:crudelab.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/crudelab/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/crudelab/llm/chat.py" = ["E501"]   # 工具說明是給大模型看的整句話，拆行反而難讀
"src/crudelab/data_needs.py" = ["E501"]   # 文檔的成段文字
"src/crudelab/cli.py" = ["E501"]          # 命令行輸出的排版行   # FastAPI 的 Depends(...) 寫在參數預設值裡是慣用法
