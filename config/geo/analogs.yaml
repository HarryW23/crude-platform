  date: 2020-03-06
  category: opec_policy
  region: 全球
  description: 疫情衝擊需求之際，俄羅斯拒絕加深減產，OPEC+ 協議破裂，沙特取消產量限制、打價格戰；疊加需求崩塌，油價數周內跌到 20 美元附近。
