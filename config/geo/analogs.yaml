- code: ABQAIQ_2019
  name_zh: 沙特阿布蓋格、胡賴斯設施遇襲
  date: 2019-09-14
  category: outage
  region: 中東
  supply_loss_mbd: 5.7
  supply_note: 沙特阿美公佈的停產量，約佔全球供應 5%；有史以來最大的單次突發中斷，月底前基本恢復
  description: 無人機和導彈襲擊沙特最大的原油處理廠，一半產量瞬間停擺；兩周左右恢復，油價漲幅很快回吐。
  sources:
    - https://www.everycrsreport.com/reports/IN11173.html
    - https://www.aljazeera.com/amp/economy/2019/9/15/saudis-race-to-restore-oil-output-after-aramco-attacks

- code: OPEC_PLUS_COLLAPSE_2020
