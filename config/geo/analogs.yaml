# 歷史事件類比庫（#29）：錄入、判斷地緣事件時的歷史參照。
#
# 這裡只記事實：日期、類別、供應損失（有權威出處的才寫，寫明口徑）、一句話經過、出處連結。
# 市場反應（Brent 之後 1 天 / 1 周 / 1 個月 / 3 個月的漲跌、月差變化）不寫在這裡：
# 由平台用你導入的價格現算（見 src/crudelab/analogs.py），口徑和其他頁面一致；沒有那段歷史數據的事件顯示「無數據」。
#
#   date            事件發生日（基準 = 這一天之前最後一個交易日的收盤）
#   category        和事件庫的類別相同：conflict / chokepoint / sanction / opec_policy / outage / policy / demand / other
#   supply_loss_mbd 供應損失（百萬桶/日），沒有可靠數字就不寫；supply_note 說明口徑
#   sources         至少一個出處
# 2026-11 用網絡搜索逐條核對過日期和數字；新增條目也請附出處。

- code: KUWAIT_1990
  name_zh: 伊拉克入侵科威特
  date: 1990-08-02
  category: conflict
  region: 中東
  supply_loss_mbd: 4.3
  supply_note: 伊拉克和科威特合計的峰值損失（EIA）；11 月前已被其他產油國增產彌補
  description: 伊拉克入侵科威特，兩國原油幾乎全部停供，油價急升；聯合國隨後對伊拉克禁運。
  sources:
    - https://www.eia.gov/todayinenergy/detail.php?id=730
    - https://www.eia.gov/outlooks/steo/archives/3Q90.pdf

- code: KATRINA_2005
  name_zh: 卡特里娜颶風（墨西哥灣）
  date: 2005-08-29
  category: outage
  region: 美灣
  supply_loss_mbd: 1.43
  supply_note: 8 月 30 日墨西哥灣原油關停 142.8 萬桶/日，約佔該區產量 95%（MMS 日報）；9 月 6 日仍有 58%
  description: 颶風登陸美國墨西哥灣沿岸，海上油田和沿岸煉廠大面積停產；IEA 釋放應急庫存。
  sources:
    - https://www.bsee.gov/sites/bsee.gov/files/reports/reports/press0830.pdf
    - https://www.ogj.com/general-interest/article/17279970/doe-storms-caused-biggest-disruption-ever-in-gulf

- code: LIBYA_2011
  name_zh: 利比亞內戰
  date: 2011-02-17
  category: conflict
  region: 北非
  supply_loss_mbd: 1.3
  supply_note: 按產量降幅估算：2010 年 150 萬桶/日以上，2011 年 5 月約 17 萬桶/日；IEA 6 月 23 日協調釋放 6000 萬桶應急庫存
  description: 利比亞爆發內戰，輕質低硫原油出口大部分中斷，持續數月。
  sources:
    - https://www.ifri.org/sites/default/files/atoms/files/glickfinalisbn.pdf
    - https://www.ogj.com/general-interest/economics-markets/article/17265634/iea-to-release-oil-stocks-to-offset-libyan-disruption

- code: OPEC_NO_CUT_2014
  name_zh: OPEC 決定不減產（爭奪市場份額）
  date: 2014-11-27
  category: opec_policy
  region: 全球
  description: 油價已大跌時，OPEC 維也納會議決定不減產，轉向爭奪市場份額、壓制高成本的美國頁岩油；當周 Brent 從約 70 美元跌到 55 美元。
  sources:
    - https://fortune.com/2014/11/27/oil-prices-in-freefall-as-opec-fails-to-agree-output-cut/

