- code: RUSSIA_UKRAINE_2022
  name_zh: 俄羅斯入侵烏克蘭
  date: 2022-02-24
  category: conflict
  region: 俄羅斯 / 黑海
  description: 俄羅斯全面入侵烏克蘭，Brent 當天自 2014 年以來首次突破 100 美元；之後西方對俄能源制裁逐步收緊（見 2022-12 禁運與限價）。當時沒有立即的供應損失數字。
