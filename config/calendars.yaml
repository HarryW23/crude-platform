# 交易所節假日日曆（見 src/crudelab/calendars.py）。序列和曲線用 calendar: 代碼 指定；沒指定的只按周一到周五算。
# 用在：斷更檢查按工作日數期限時跳過假期；期貨換月的最後交易日按交易所工作日算。
#
# rules：每年都有的規則，自動推出每一年（寫法見 schema.HolidayRule）
# dates：逐年登記的假期，只登記周一到周五的日子（周末本來就不交易，調休上班的周末交易所也不開市）
# years：dates 已經登記全的年份；沒登記的年份退回只按周一到周五算，crudelab check 會提醒
# verified：是否已經和交易所公布的假期表逐條核對過

calendars:
  - code: CME
    name_zh: 美國（CME / NYMEX 能源）
    verified: false
    source: CME Group 假期表（每年公布）
    notes: >-
      能源合約不出結算價的日子。其中馬丁路德金日、總統日、陣亡將士紀念日、六月節、獨立日、勞工日、感恩節
      電子盤有部分交易，但當天沒有結算價，數據上就是沒有這一天。核對時以 CME 每年的假期表為準。
    rules:
      - {name: 元旦, month: 1, day: 1, observe: sunday_to_monday}
      - {name: 馬丁路德金日, month: 1, weekday: 0, nth: 3}
      - {name: 總統日, month: 2, weekday: 0, nth: 3}
      - {name: 耶穌受難日, easter_offset: -2}
      - {name: 陣亡將士紀念日, month: 5, weekday: 0, nth: -1}
      - {name: 六月節, month: 6, day: 19, observe: nearest, since: 2022}
      - {name: 獨立日, month: 7, day: 4, observe: nearest}
      - {name: 勞工日, month: 9, weekday: 0, nth: 1}
      - {name: 感恩節, month: 11, weekday: 3, nth: 4}
      - {name: 聖誕節, month: 12, day: 25, observe: nearest}

  - code: ICE_EU
    name_zh: 歐洲（ICE Futures Europe：Brent、柴油）
    verified: false
    source: ICE Futures Europe 假期表（每年公布）
    notes: >-
      只列肯定休市的日子：元旦、耶穌受難日、聖誕、節禮日。英國其他銀行假日（復活節星期一、五月和八月的銀行假日）
      ICE 的 Brent 一般照常交易，沒有列入。落在周末時的順延規則（例如聖誕在周六時是否休周一、周二）未核對。
    rules:
      - {name: 元旦, month: 1, day: 1}
      - {name: 耶穌受難日, easter_offset: -2}
      - {name: 聖誕節, month: 12, day: 25, observe: next_weekdays}
      - {name: 節禮日, month: 12, day: 26, observe: next_weekdays}

  - code: UK_BANK
    name_zh: 英國（英格蘭）銀行假日：ICE 合約算到期日用
    verified: true
    source: 英國政府銀行假日表；2016-10 ~ 2026-11 用路透 LCOc1、LGOc1 的實際到期日核對過
    notes: >-
      ICE Futures Europe 在英國銀行假日（復活節星期一、五月的兩個、八月的一個）照常交易 Brent、柴油，
      但算合約到期的「工作日」時不算這些日子：例如 2020-08-31、2021-05-31、2026-08-31（周一銀行假日）
      那個月的 Brent 提前到前一個周五到期，2020-04 的柴油因復活節星期一提前一天。所以只給換月規則用
      （roll.calendar），交易日曆仍是 ICE_EU。
      臨時調整的年份寫在 dates：規則會照常推出原來那天（例如 2020-05-04、2022-05-30 其實不是假日），
      這兩天不在月底，也不在 14 日前後，不影響 Brent、柴油的到期日。
    rules:
      - {name: 元旦, month: 1, day: 1, observe: next_weekdays}
      - {name: 耶穌受難日, easter_offset: -2}
      - {name: 復活節星期一, easter_offset: 1}
      - {name: 五月初銀行假日, month: 5, weekday: 0, nth: 1}
      - {name: 春季銀行假日, month: 5, weekday: 0, nth: -1}
      - {name: 夏季銀行假日, month: 8, weekday: 0, nth: -1}
      - {name: 聖誕節, month: 12, day: 25, observe: next_weekdays}
      - {name: 節禮日, month: 12, day: 26, observe: next_weekdays}
    dates: [2020-05-08, 2022-06-02, 2022-06-03, 2022-09-19, 2023-05-08]

  - code: CN
    name_zh: 中國（上期所 / 上海國際能源交易中心、國內現貨）
    verified: true
    source: 國務院辦公廳關於 2026 年（2025-11-04 發布）、2027 年（國辦發明電〔2026〕10 號，2026-11-05 發布）部分節假日安排的通知
    notes: 每年 11 月前後公布下一年的安排，公布後在這裡補上那一年的日期並把年份加進 years
    years: [2026, 2027]
    dates: [
      # 2026 元旦 01-01～01-03
      2026-01-01, 2026-01-02,
      # 2026 春節 02-15～02-23
      2026-02-16, 2026-02-17, 2026-02-18, 2026-02-19, 2026-02-20, 2026-02-23,
      # 2026 清明 04-04～04-06
      2026-04-06,
      # 2026 勞動節 05-01～05-05
      2026-05-01, 2026-05-04, 2026-05-05,
      # 2026 端午 06-19～06-21
      2026-06-19,
      # 2026 中秋 09-25～09-27
      2026-09-25,
      # 2026 國慶 10-01～10-07
      2026-10-01, 2026-10-02, 2026-10-05, 2026-10-06, 2026-10-07,
      # 2027 元旦 01-01～01-03
      2027-01-01,
      # 2027 春節 02-05～02-13
      2027-02-05, 2027-02-08, 2027-02-09, 2027-02-10, 2027-02-11, 2027-02-12,
      # 2027 清明 04-03～04-05
      2027-04-05,
      # 2027 勞動節 05-01～05-05
      2027-05-03, 2027-05-04, 2027-05-05,
      # 2027 端午 06-09
      2027-06-09,
      # 2027 中秋 09-15
      2027-09-15,
      # 2027 國慶 10-01～10-07
      2027-10-01, 2027-10-04, 2027-10-05, 2027-10-06, 2027-10-07,
    ]
