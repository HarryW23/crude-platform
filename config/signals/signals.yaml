# 方向信號：看某個序列或指標的最新值相對自身歷史偏高還是偏低，折成 −1（利空）到 +1（利多）的分數。
#   z     = (最新值 − 回看期均值) / 回看期標準差
#   score = clip(z / 2, −1, 1) × direction
#   direction  +1 = 數值越高對油價越利多；−1 = 越高越利空。這是方向判斷，請按你的理解核對
#   lookback_days  回看多少天；min_points 樣本少於這個數就不出分
#   weight     在模組內的初始權重。之後是參數 W_{code}（後台「參數」頁的「信號權重」組），帶生效日期和版本記錄；
#              回測會按預測力給出建議權重，逐步前推檢驗變好時可以在參數頁一鍵採用。0 = 不參與合成
#   detrend    none（預設）和回看期均值比 / linear 和回看期的線性趨勢比。回測頁會標出輸入「有趨勢」的信號，
#              確認趨勢有經濟含義（不只是價格的隨機遊走）再改成 linear
# 地緣模組的信號來自事件庫（各事件的方向判斷），不在這裡定義。
# 模組之間的權重是參數 SIG_WEIGHT_*，在後台修改。

