# 參數 = 帶生效日期的常數。這裡給的是初始值；之後在後台修改（可指定生效日期），以後台為準。
#   value     自始生效的單一數值
#   versions  多個生效日期：[{valid_from: 2019-04-01, value: 0.13, note: …}]
#   兩個都不寫 = 必填但尚未提供，用到它的指標會顯示「缺參數」
#   verified  false（缺省）表示數值是暫定的，尚待你核對；後台核對後會記為已核對
#   unit      會參與公式的量綱檢查；無量綱不用寫

