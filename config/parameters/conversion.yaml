# ---------- 分油種的桶/噸（#28） ----------
# 換算：比重 SG = 141.5 / (API + 131.5)；桶/噸 = 1000 / (SG × 158.987)（每桶 158.987 升）。
# 「API x」寫在 description 開頭，測試會按上式核對數值，改 API 時兩邊要一起改。
# API 度是各機構公佈的典型值，實際每船隨批次浮動（±1 API ≈ ±0.03 桶/噸）；有 Platts / Argus 的官方折算係數時請以它為準並在後台核對。
# 噸是公噸（不是英制長噸），按真空質量算；貿易上的空氣中質量約差 0.1%，可忽略。
- {key: BBL_PER_T_ESPO, name_zh: ESPO 桶/噸, value: 7.39, unit: bbl/t, group: 單位換算,
