# 數據斷更提醒：序列多久沒更新算斷更。
# 由定時任務 CHECK_FRESHNESS 每天檢查（見 schedule.yaml）；有斷更時通過失敗通知發出，前台總覽也會提示。
#
# defaults：按頻率的預設規則
#   max_days  期限
#   count     weekdays 只數周一至周五 / calendar 日曆天（預設）
#   basis     observed 看最新數據的日期（預設）/ received 看最近一次收到新數據的時間
#             帶預測期的月度、季度數據要用 received：它們的最新日期本來就在未來
# watch      has_data：只檢查有過數據的序列（預設，不會為你從沒導入過的序列報警）/ all：全部
# required   必須有數據的關鍵序列：從沒有過數據也會報
# ignore     不檢查的序列
# overrides  個別序列的規則，例如中國市場的數據遇到長假時放寬
# repeats    重複報價：同一個數連續出現 max_run 次以上，算數據商在沿用舊值（不是新報價），也報斷更；
#            導入預覽時文件裡有這種長段也會提醒。只看日度序列。
#            kinds 要檢查的序列類型（期貨結算價、匯率在假期或冷門月份不變是正常的，預設不查）；
#            series 另外要查的序列；ignore 不查的（例如本來就每周評估一次、平時每天沿用的價格）
defaults:
  daily:     {max_days: 3, count: weekdays}       # 周五的數據，下周三還沒更新到新日期就報
  weekly:    {max_days: 14}                       # EIA 周報在下周三發佈，正常最多隔 13 天左右
  monthly:   {max_days: 40, basis: received}      # 月報約每月一次
  quarterly: {max_days: 45, basis: received}      # IEA / OPEC 的季度數字隨月報更新

watch: has_data
required: []
ignore: []
repeats: {max_run: 5, kinds: [spot, diff], series: [], ignore: [CN_JET_EXWORKS]}   # 航煤出廠價每月調一次
# spikes     單日錯價提醒（導入預覽）。confirmed：核對過、確實是行情的日子，不再提醒
spikes:
  # 錯的那些不寫在這裡，寫在序列配置的 bad_days（導入時跳過、已入庫的移除）
  confirmed:
    WTI_M1: [2020-04-20]            # 5 月合約到期前一天，庫容用盡，結算價 −37.63
    HO_M1: [2022-04-28]             # 5 月合約到期前一天的逼倉：結算 5.1354，次日到期 4.7817（Sprague MarketWatch）
    SC_M1: [2022-03-31]             # SC2204 最後交易日，到期合約成交稀，次日 M1 換成 2205
    SG_JET_KERO: [2026-04-08]       # 美伊停火，新加坡航煤收 193.53，汽柴油同日跌兩位數（路透）
    TD3C_WS: [2020-03-24, 2026-03-16, 2026-04-17]   # 2020-03 TD15 同日同樣下跌；2026-03 中旬霍爾木茲危機短暫超過 WS600；
                                                    # 2026-04-17 Brent 單日跌 11%
    TD20_WS: [2020-03-16]           # 2020-03 中旬 TD3C、TD15 同一天也見頂回落
    WTI_MIDLAND_DIFF: [2018-06-06, 2018-08-10]      # 2018 年二疊紀管輸瓶頸，米德蘭升貼水一兩天內來回 2–3 美元很常見
overrides:
  - {series: ARAB_LIGHT_OSP_ASIA, max_days: 40, basis: received}
  - {series: ARAB_MEDIUM_OSP_ASIA, max_days: 40, basis: received}
  - {series: ARAB_HEAVY_OSP_ASIA, max_days: 40, basis: received}
  - {series: BASRAH_MEDIUM_OSP_ASIA, max_days: 40, basis: received}
  - {series: BASRAH_HEAVY_OSP_ASIA, max_days: 40, basis: received}
