# 定時任務：什麼時候、自動做什麼。改完幾秒內自動生效，不用重啟。
# 任務的執行情況在後台的「定時任務」頁看，那裡也可以手動立即運行。
#
#   時間二選一：
#     at: "18:30" + days       days 可以是 daily（每天）、weekdays（周一至周五），或 [mon, wed, fri] 這樣的列表
#                              再加 day_of_month: 1 可以限定每月幾號（1–28）
#     every_minutes: 10        每隔幾分鐘
#   enabled: false             停用這個任務（仍可在後台手動運行）
#   catch_up_hours             程序沒開而錯過的任務，多少小時內補跑一次（預設 12；0 = 不補）
#   動作 action：
#     import_folder  導入收件夾裡的 Excel / CSV。folder 是 data/ 下的文件夾名，source 是記在哪個數據源名下
#                    導完的文件移到 done/，出錯的移到 failed/。只入庫能自動識別的列
#     pull           從接口取數。還沒配密鑰時只記「跳過」，不算失敗
#     report         生成報告。kind: daily / weekly / monthly；narrative: true 會調用大模型寫解讀（要花錢）
#     check_freshness  檢查數據有沒有斷更（規則在 freshness.yaml）。有斷更時記為失敗，從而觸發通知
#     backup         備份數據庫、配置和原始文件，並清理舊備份（位置和保留策略在 backup.yaml）
#     calendar       同步金十財經日曆，把超預期換算成序列（規則在 jin10.yaml）
timezone: Asia/Shanghai

jobs:
  # 整理數據的同事把 Excel 放進 data/inbox/，十分鐘內自動導入
  - {code: IMPORT_INBOX, name_zh: 導入收件夾, action: import_folder, source: reuters_xls, folder: inbox,
     every_minutes: 10}

  # EIA 周報通常在美東時間周三上午發佈（北京時間周三深夜），周四早上取；另外每天取一次以涵蓋延期和月度數據
  - {code: PULL_EIA, name_zh: 取 EIA 數據, action: pull, source: eia, at: "07:30", days: daily}

  # CFTC 持倉報告：美東周五下午發佈（北京時間周六凌晨），周六早上取；漏了的話周日補（catch_up_hours）
  - {code: PULL_CFTC, name_zh: 取 CFTC 持倉, action: pull, source: cftc, at: "08:10", days: [sat, sun], catch_up_hours: 24}

  # 金十財經日曆：每 2 小時同步一次（公佈後的實際值最多 2 小時內入庫）。沒設 JIN10_TOKEN 時只記「跳過」
  - {code: SYNC_JIN10_CALENDAR, name_zh: 同步財經日曆, action: calendar, every_minutes: 120}

  # 每個工作日早上檢查一次有沒有數據斷更；持續斷更時按 notifications.yaml 的 repeat_hours 提醒
  - {code: CHECK_FRESHNESS, name_zh: 檢查數據斷更, action: check_freshness, at: "09:15", days: weekdays}

  - {code: REPORT_DAILY, name_zh: 生成日報, action: report, kind: daily, at: "18:30", days: weekdays}
  - {code: REPORT_WEEKLY, name_zh: 生成周報, action: report, kind: weekly, at: "19:00", days: [fri]}
  - {code: REPORT_MONTHLY, name_zh: 生成月報, action: report, kind: monthly, at: "09:00", day_of_month: 1,
     enabled: false}

  # 每天凌晨備份一次（避開導入和報告的時間）。失敗會走失敗通知
  - {code: BACKUP_DAILY, name_zh: 每日備份, action: backup, at: "02:30", days: daily}
