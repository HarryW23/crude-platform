# 序列字典：平台裡每一條時間序列的唯一定義。
#   code      唯一代碼，只能用大寫字母、數字、下劃線（會直接出現在指標公式裡）
#   kind      futures 期貨結算 / swap 掉期 / spot 現貨絕對價 / diff 現貨升貼水 / osp 官價
#             / freight 運費 / fx 匯率 / stock 庫存 / flow 流量 / ratio 比率
#   benchmark 升貼水或官價所對應的基準（僅說明用途）
#   module    主要歸屬模組：spread 地域價差 / balance 供需 / refinery 煉廠 / common 公用
#   aliases   導入 Excel 時用來自動識別列名的別名（路透 RIC、中英文名等），後台可繼續添加
#   eia_id    EIA 序列號，供 EIA connector 使用
#
# curves：期貨曲線模板，會展開成 {code}_M1、{code}_M2 … 多條序列。
#   aliases 裡的 {n} 會替換成月份序號。

curves:
  - {code: BRENT, name_zh: 布倫特期貨, commodity: BRENT, location: NWE, kind: futures, unit: USD/bbl,
     months: [1, 2, 3], module: common, aliases: ["LCOc{n}", "Brent M{n}", "布倫特M{n}", "ICE Brent M{n}"]}
  - {code: WTI, name_zh: WTI 期貨, commodity: WTI, location: CUSHING, kind: futures, unit: USD/bbl,
     months: [1, 2, 3], module: common, aliases: ["CLc{n}", "WTI M{n}", "NYMEX WTI M{n}"]}
  - {code: DUBAI_SWAP, name_zh: 迪拜掉期, commodity: DUBAI, location: MEG, kind: swap, unit: USD/bbl,
     months: [1, 2, 3], module: common, aliases: ["Dubai Swap M{n}", "迪拜掉期M{n}", "Dubai M{n}"]}
  - {code: SC, name_zh: 上海原油期貨, commodity: SC, location: CHINA, kind: futures, unit: CNY/bbl,
     months: [1, 2, 3], module: common, aliases: ["ISCc{n}", "SC M{n}", "INE SC M{n}", "上海原油M{n}"]}
  - {code: GASOIL_ICE, name_zh: ICE 柴油期貨, commodity: GASOIL, location: NWE, kind: futures, unit: USD/t,
     months: [1, 2, 3], module: refinery, aliases: ["LGOc{n}", "ICE Gasoil M{n}"]}
  - {code: RBOB, name_zh: RBOB 汽油期貨, commodity: GASOLINE, location: NYH, kind: futures, unit: USD/gal,
     months: [1, 2], module: refinery, aliases: ["RBc{n}", "RBOB M{n}"]}
  - {code: HO, name_zh: 取暖油（ULSD）期貨, commodity: GASOIL, location: NYH, kind: futures, unit: USD/gal,
     months: [1, 2], module: refinery, aliases: ["HOc{n}", "Heating Oil M{n}", "ULSD M{n}"]}

