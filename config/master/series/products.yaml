# 成品油與化工品。字段說明見 crude.yaml。

curves:
  - {code: GASOIL_ICE, name_zh: ICE 柴油期貨, commodity: GASOIL, location: NWE, kind: futures, unit: USD/t,
     months: [1, 2, 3], module: refinery, aliases: ["LGOc{n}", "ICE Gasoil M{n}"],
     roll: {months_before: 0, day: 14, business_days_before: 2, note: "ICE Gasoil：交割月 14 日之前 2 個工作日"}}
  - {code: RBOB, name_zh: RBOB 汽油期貨, commodity: GASOLINE, location: NYH, kind: futures, unit: USD/gal,
     months: [1, 2], module: refinery, aliases: ["RBc{n}", "RBOB M{n}"],
     roll: {months_before: 1, day: last_business, note: "NYMEX RBOB：交割月前一個月的最後一個工作日"}}
  - {code: HO, name_zh: 取暖油（ULSD）期貨, commodity: GASOIL, location: NYH, kind: futures, unit: USD/gal,
     months: [1, 2], module: refinery, aliases: ["HOc{n}", "Heating Oil M{n}", "ULSD M{n}"],
     roll: {months_before: 1, day: last_business, note: "NYMEX 取暖油：交割月前一個月的最後一個工作日"}}

