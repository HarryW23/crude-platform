# 供需：產量、需求、庫存、進出口。字段說明見 crude.yaml。
# 期間型數據（月度、季度）一律記在期間第一天：2026 年 9 月 → 2026-09-01。未來期間的值就是預測。
# eia_id 是 EIA 的序列號，供 EIA connector 取數；這些序列號是按記憶填的，沒有實際調用驗證過。

series:
  # ---------- 美國周度（EIA 周報，日期為周五） ----------
  - {code: EIA_CRUDE_STOCKS, name_zh: 美國商業原油庫存, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.WCESTUS1.W, aliases: ["US Commercial Crude Stocks", "美國商業原油庫存"]}
  - {code: EIA_SPR_STOCKS, name_zh: 美國戰略儲備原油庫存, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.WCSSTUS1.W, aliases: ["US SPR Stocks", "美國戰略儲備"]}
  - {code: EIA_CUSHING_STOCKS, name_zh: 庫欣原油庫存, commodity: US_FUNDAMENTAL, location: CUSHING, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.W_EPC0_SAX_YCUOK_MBBL.W, aliases: ["Cushing Stocks", "庫欣庫存"]}
  - {code: EIA_GASOLINE_STOCKS, name_zh: 美國汽油庫存, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.WGTSTUS1.W, aliases: ["US Gasoline Stocks", "美國汽油庫存"]}
  - {code: EIA_DISTILLATE_STOCKS, name_zh: 美國餾分油庫存, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.WDISTUS1.W, aliases: ["US Distillate Stocks", "美國餾分油庫存"]}
  - {code: EIA_JET_STOCKS, name_zh: 美國航煤庫存, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, eia_id: PET.WKJSTUS1.W, aliases: ["US Jet Stocks", "美國航煤庫存"]}
  - {code: EIA_CRUDE_PRODUCTION, name_zh: 美國原油產量, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WCRFPUS2.W, aliases: ["US Crude Production", "美國原油產量"]}
  - {code: EIA_CRUDE_IMPORTS, name_zh: 美國原油進口, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WCRIMUS2.W, aliases: ["US Crude Imports", "美國原油進口"]}
  - {code: EIA_CRUDE_EXPORTS, name_zh: 美國原油出口, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WCREXUS2.W, aliases: ["US Crude Exports", "美國原油出口"]}
  - {code: EIA_REFINERY_INPUT, name_zh: 美國煉廠原油加工量, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WCRRIUS2.W, aliases: ["US Refinery Crude Input", "美國煉廠加工量"]}
  - {code: EIA_REFINERY_UTIL, name_zh: 美國煉廠開工率, commodity: US_FUNDAMENTAL, location: US, kind: ratio, unit: pct,
     frequency: weekly, module: balance, eia_id: PET.WPULEUS3.W, aliases: ["US Refinery Utilization", "美國煉廠開工率"]}
  - {code: EIA_REFINERY_GROSS_INPUT, name_zh: 美國煉廠總投入量, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: refinery, eia_id: PET.WGIRIUS2.W, aliases: ["US Refiner Gross Inputs", "美國煉廠總投入"],
     notes: 進常減壓裝置的原油和其他原料；開工率 = 總投入量 ÷ 可運行產能}
  - {code: EIA_REFINERY_CAPACITY, name_zh: 美國煉廠可運行產能（常減壓）, commodity: US_FUNDAMENTAL, location: US, kind: flow,
     unit: kb/d, frequency: weekly, module: refinery, eia_id: PET.WOCLEUS2.W,
     aliases: ["US Operable Crude Distillation Capacity", "美國煉廠可運行產能"]}
  - {code: EIA_PADD3_REFINERY_UTIL, name_zh: 美灣（PADD 3）煉廠開工率, commodity: US_FUNDAMENTAL, location: USGC, kind: ratio,
     unit: pct, frequency: weekly, module: refinery, eia_id: PET.W_NA_YUP_R30_PER.W,
     aliases: ["PADD 3 Refinery Utilization", "美灣煉廠開工率"]}
  - {code: EIA_PRODUCT_SUPPLIED, name_zh: 美國成品油表觀需求（合計）, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WRPUPUS2.W, aliases: ["US Total Product Supplied", "美國成品油表需"]}
  - {code: EIA_GASOLINE_SUPPLIED, name_zh: 美國汽油表觀需求, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WGFUPUS2.W, aliases: ["US Gasoline Supplied", "美國汽油表需"]}
  - {code: EIA_DISTILLATE_SUPPLIED, name_zh: 美國餾分油表觀需求, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WDIUPUS2.W, aliases: ["US Distillate Supplied", "美國餾分油表需"]}
  - {code: EIA_JET_SUPPLIED, name_zh: 美國航煤表觀需求, commodity: US_FUNDAMENTAL, location: US, kind: flow, unit: kb/d,
     frequency: weekly, module: balance, eia_id: PET.WKJUPUS2.W, aliases: ["US Jet Supplied", "美國航煤表需"]}

  # ---------- 全球月度（EIA 短期能源展望 STEO，含預測） ----------
  # vintaged：機構每期都會修訂過去的數字，按報告期保存（回測用當時發佈的那一期）。
  #   補錄歷史報告時在導入頁填「報告發佈日期」；EIA 每天取數，數字變了才記新的一期
  - {code: STEO_OPEC_SUPPLY, vintaged: true, name_zh: OPEC 液體燃料產量（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: OPEC, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PAPR_OPEC.M, aliases: ["STEO OPEC Supply", "OPEC液體產量"]}
  - {code: STEO_NONOPEC_SUPPLY, vintaged: true, name_zh: 非 OPEC 液體燃料產量（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: NON_OPEC, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PAPR_NONOPEC.M, aliases: ["STEO Non-OPEC Supply", "非OPEC液體產量"]}
  - {code: STEO_OPEC_CRUDE, vintaged: true, name_zh: OPEC 原油產量（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: OPEC, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.COPR_OPEC.M, aliases: ["STEO OPEC Crude", "OPEC原油產量"]}
  - {code: STEO_US_CRUDE, vintaged: true, name_zh: 美國原油產量（EIA 月度）, commodity: GLOBAL_FUNDAMENTAL, location: US, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.COPRPUS.M, aliases: ["STEO US Crude Production"]}
  - {code: STEO_OECD_DEMAND, vintaged: true, name_zh: OECD 需求（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: OECD, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PATC_OECD.M, aliases: ["STEO OECD Demand", "OECD需求"]}
  - {code: STEO_NONOECD_DEMAND, vintaged: true, name_zh: 非 OECD 需求（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: NON_OECD, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PATC_NON_OECD.M, aliases: ["STEO Non-OECD Demand", "非OECD需求"]}
  - {code: STEO_CHINA_DEMAND, vintaged: true, name_zh: 中國需求（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: CHINA, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PATC_CH.M, aliases: ["STEO China Demand", "中國需求EIA"]}
  - {code: STEO_US_DEMAND, vintaged: true, name_zh: 美國需求（EIA 月度）, commodity: GLOBAL_FUNDAMENTAL, location: US, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, eia_id: STEO.PATC_US.M, aliases: ["STEO US Demand"]}
  - {code: STEO_OECD_STOCKS, vintaged: true, name_zh: OECD 商業庫存（EIA）, commodity: GLOBAL_FUNDAMENTAL, location: OECD, kind: stock, unit: mb,
     frequency: monthly, module: balance, eia_id: STEO.PASC_OECD_T3.M, aliases: ["STEO OECD Stocks", "OECD商業庫存"]}

  # ---------- 其他機構（月報，Excel 導入；用來和 EIA 的口徑對照） ----------
  - {code: IEA_WORLD_DEMAND, vintaged: true, name_zh: 全球需求（IEA）, commodity: GLOBAL_FUNDAMENTAL, location: GLOBAL, kind: flow, unit: mb/d,
     frequency: quarterly, module: balance, aliases: ["IEA World Demand", "IEA全球需求"]}
  - {code: IEA_WORLD_SUPPLY, vintaged: true, name_zh: 全球供應（IEA）, commodity: GLOBAL_FUNDAMENTAL, location: GLOBAL, kind: flow, unit: mb/d,
     frequency: quarterly, module: balance, aliases: ["IEA World Supply", "IEA全球供應"]}
  - {code: OPEC_WORLD_DEMAND, vintaged: true, name_zh: 全球需求（OPEC）, commodity: GLOBAL_FUNDAMENTAL, location: GLOBAL, kind: flow, unit: mb/d,
     frequency: quarterly, module: balance, aliases: ["OPEC World Demand", "OPEC全球需求"]}
  - {code: OPEC_CALL_ON_OPEC, vintaged: true, name_zh: 對 OPEC 原油的需求（OPEC）, commodity: GLOBAL_FUNDAMENTAL, location: OPEC, kind: flow, unit: mb/d,
     frequency: quarterly, module: balance, aliases: ["Call on OPEC", "對OPEC原油需求"]}

  # ---------- OPEC+ 分國原油產量（路透每月產量調查，#14） ----------
  # 月度，記在當月第一天。路透調查之後常有修訂：以最新一次導出為準（不按期保存）。
  - {code: CRUDE_PROD_SAUDI, name_zh: 沙特原油產量, commodity: CRUDE_SUPPLY, location: SAUDI, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [Saudi crude production, 沙特產量]}
  - {code: CRUDE_PROD_IRAQ, name_zh: 伊拉克原油產量, commodity: CRUDE_SUPPLY, location: IRAQ, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [Iraq crude production, 伊拉克產量]}
  - {code: CRUDE_PROD_UAE, name_zh: 阿聯酋原油產量, commodity: CRUDE_SUPPLY, location: UAE, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [UAE crude production, 阿聯酋產量]}
  - {code: CRUDE_PROD_KUWAIT, name_zh: 科威特原油產量, commodity: CRUDE_SUPPLY, location: KUWAIT, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [Kuwait crude production, 科威特產量]}
  - {code: CRUDE_PROD_IRAN, name_zh: 伊朗原油產量, commodity: CRUDE_SUPPLY, location: IRAN, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [Iran crude production, 伊朗產量]}
  - {code: CRUDE_PROD_RUSSIA, name_zh: 俄羅斯原油產量, commodity: CRUDE_SUPPLY, location: RUSSIA, kind: flow, unit: mb/d,
     frequency: monthly, module: balance, provider: lseg_survey, aliases: [Russia crude production, 俄羅斯產量]}
  - {code: CRUDE_PROD_OPEC, name_zh: OPEC 原油產量合計（調查）, commodity: CRUDE_SUPPLY, location: OPEC, kind: flow,
     unit: mb/d, frequency: monthly, module: balance, provider: lseg_survey, aliases: [OPEC crude production survey, OPEC產量]}

  # ---------- 超預期（來自金十財經日曆，實際 − 公佈時的市場預期） ----------
  # 由 config/jin10.yaml 的 calendar_rules 換算寫入。只有從接入那天起才有數據（日曆接口不給歷史），要積累一段時間。
  - {code: CAL_EIA_CRUDE_SURPRISE, name_zh: EIA 原油庫存超預期, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance, notes: 正 = 累庫比預期多（或去庫比預期少），偏利空}
  - {code: CAL_EIA_GASOLINE_SURPRISE, name_zh: EIA 汽油庫存超預期, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance}
  - {code: CAL_EIA_DISTILLATE_SURPRISE, name_zh: EIA 餾分油庫存超預期, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance}
  - {code: CAL_API_CRUDE_SURPRISE, name_zh: API 原油庫存超預期, commodity: US_FUNDAMENTAL, location: US, kind: stock, unit: kb,
     frequency: weekly, module: balance}

  # ---------- 煉廠檢修與開工（沒有免費接口：Excel 導入，或日後接資訊商 API） ----------
  # 全球停工量：諮詢機構（例如 IIR、Platts、Energy Aspects）或 IEA 月報的「煉廠停工 / 檢修量」，含計劃與非計劃，
  #   月度、記在月初，未來月份是預測。口徑各家不同，換來源時要從頭換，不要混著接。
  - {code: GLOBAL_REFINERY_OUTAGES, name_zh: 全球煉廠停工量（檢修 + 非計劃）, commodity: GLOBAL_FUNDAMENTAL, location: GLOBAL,
     kind: flow, unit: kb/d, frequency: monthly, module: refinery, provider: consult,
     aliases: ["Global Refinery Outages", "Global Refinery Maintenance", "全球煉廠檢修量", "全球煉廠停工量"]}
  # 中國開工率：國內資訊商（隆眾、卓創、金聯創等）的周度數據，口徑同樣要固定一家。
  - {code: CN_SD_TEAPOT_UTIL, name_zh: 山東地煉常減壓開工率, commodity: CN_FUNDAMENTAL, location: SHANDONG, kind: ratio, unit: pct,
     frequency: weekly, module: refinery, calendar: CN, provider: cn_vendor,
     aliases: ["山東地煉開工率", "山東地煉常減壓開工率", "Shandong Teapot Utilization"]}
  - {code: CN_MAJOR_REFINERY_UTIL, name_zh: 中國主營煉廠開工率, commodity: CN_FUNDAMENTAL, location: CHINA, kind: ratio, unit: pct,
     frequency: weekly, module: refinery, calendar: CN, provider: cn_vendor,
     aliases: ["主營煉廠開工率", "中國主營煉廠開工率", "China Major Refinery Utilization"]}
