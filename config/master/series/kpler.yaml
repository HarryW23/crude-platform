# Kpler：船舶跟蹤的原油海運流量和庫存（#25）。在 Kpler 網頁終端把圖下載成 Excel，原樣在後台導入
# （數據源選「Kpler（終端下載）」），怎麼下載見 README 的 Kpler 一節。讀表見 src/crudelab/connectors/kpler.py。
# 別名「kpler:表的種類:Kpler 的列名」對應 Kpler 下載表裡的一列（例如 kpler:exports:Saudi Arabia）。
# 要加國家：照下面的寫法加一條序列，別名用 Kpler 表頭裡的原名（例如 Russian Federation、South Korea）。
# 流量月度（記在當月 1 日，千桶/日），庫存周度（記在那一周的周一，千桶）。都按報告期保存：
# Kpler 會隨著貨物卸完修訂前幾期，每次導入記一期。還沒結束的這一期（這個月、這一周）不讀，數字不完整。
# 以後開通 Kpler API，換成接口取數，序列代碼不變。

series:
  # ---------- 原油出口（按裝貨國，月度；Flows → Exports，按 Origin country 拆分） ----------
  - {code: KPLER_EXP_SAUDI, name_zh: 沙特原油出口（Kpler）, commodity: CRUDE_FLOWS, location: SAUDI, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Saudi Arabia"]}
  - {code: KPLER_EXP_IRAQ, name_zh: 伊拉克原油出口（Kpler）, commodity: CRUDE_FLOWS, location: IRAQ, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Iraq"]}
  - {code: KPLER_EXP_UAE, name_zh: 阿聯酋原油出口（Kpler）, commodity: CRUDE_FLOWS, location: UAE, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:United Arab Emirates"]}
  - {code: KPLER_EXP_KUWAIT, name_zh: 科威特原油出口（Kpler）, commodity: CRUDE_FLOWS, location: KUWAIT, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Kuwait"]}
  - {code: KPLER_EXP_IRAN, name_zh: 伊朗原油出口（Kpler）, commodity: CRUDE_FLOWS, location: IRAN, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Iran"]}
  - {code: KPLER_EXP_RUSSIA, name_zh: 俄羅斯原油出口（Kpler）, commodity: CRUDE_FLOWS, location: RUSSIA, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Russian Federation"]}
  - {code: KPLER_EXP_KAZAKHSTAN, name_zh: 哈薩克斯坦原油出口（Kpler）, commodity: CRUDE_FLOWS, location: KAZAKHSTAN, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Kazakhstan"]}
  - {code: KPLER_EXP_US, name_zh: 美國原油出口（Kpler）, commodity: CRUDE_FLOWS, location: US, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:United States"]}
  - {code: KPLER_EXP_BRAZIL, name_zh: 巴西原油出口（Kpler）, commodity: CRUDE_FLOWS, location: BRAZIL, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:exports:Brazil"]}

  # ---------- 原油進口（按卸貨國 / 地區，月度；Flows → Imports，按 Destination country 或 continent 拆分） ----------
  - {code: KPLER_IMP_CHINA, name_zh: 中國原油進口（Kpler）, commodity: CRUDE_FLOWS, location: CHINA, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:China"]}
  - {code: KPLER_IMP_INDIA, name_zh: 印度原油進口（Kpler）, commodity: CRUDE_FLOWS, location: INDIA, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:India"]}
  - {code: KPLER_IMP_EUROPE, name_zh: 歐洲原油進口（Kpler）, commodity: CRUDE_FLOWS, location: EUROPE, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:Europe"]}
  - {code: KPLER_IMP_US, name_zh: 美國原油進口（Kpler）, commodity: CRUDE_FLOWS, location: US, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:United States"]}
  - {code: KPLER_IMP_JAPAN, name_zh: 日本原油進口（Kpler）, commodity: CRUDE_FLOWS, location: JAPAN, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:Japan"]}
  - {code: KPLER_IMP_KOREA, name_zh: 韓國原油進口（Kpler）, commodity: CRUDE_FLOWS, location: KOREA, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:imports:South Korea"]}

  # ---------- 全球原油庫存（周度；Inventories → Crude，含海上，按 onshore/offshore status 拆分） ----------
  # 浮倉：裝著貨、停留一段時間不動的船（Kpler 預設 7 天以上，不要改，否則前後不可比）；在途：正在航行的貨
  - {code: KPLER_INV_WORLD, name_zh: 全球原油庫存合計（Kpler）, commodity: CRUDE_FLOATING, location: GLOBAL, kind: stock,
     unit: kb, frequency: weekly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:inventories:Level (Kb)"], notes: 陸上 + 在途 + 浮倉}
  - {code: KPLER_ONSHORE_WORLD, name_zh: 全球原油陸上庫存（Kpler）, commodity: CRUDE_FLOATING, location: GLOBAL, kind: stock,
     unit: kb, frequency: weekly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:inventories:Onshore"]}
  - {code: KPLER_FLOATING_WORLD, name_zh: 全球原油浮倉（Kpler）, commodity: CRUDE_FLOATING, location: GLOBAL, kind: stock,
     unit: kb, frequency: weekly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:inventories:Floating Storage"]}
  - {code: KPLER_ON_WATER_WORLD, name_zh: 全球原油在途（Kpler）, commodity: CRUDE_FLOATING, location: GLOBAL, kind: stock,
     unit: kb, frequency: weekly, module: balance, provider: kpler, vintaged: true,
     aliases: ["kpler:inventories:Oil in Transit on Ships"]}
