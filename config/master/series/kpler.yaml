  - {code: KPLER_IMP_EUROPE, name_zh: 歐洲原油進口（Kpler）, commodity: CRUDE_FLOWS, location: EUROPE, kind: flow,
     unit: kb/d, frequency: monthly, module: balance, provider: kpler, vintaged: true,
